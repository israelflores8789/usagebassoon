#:schema https://json.schemastore.org/pyproject.json
# SPDX-FileCopyrightText: 2026 Israel Flores-Arbolay
# SPDX-License-Identifier: AGPL-3.0-only

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "usagebassoon"
dynamic = ["version"]
description = "Persistent analytics over tokscale's stateless JSON exports"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.0",
    "plotext>=5.2",
    "pyarrow>=25.0.1",
    "sqlglot>=30.18.0",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
bigquery = [
    "google-cloud-bigquery>=3.17",
    "google-cloud-bigquery-storage>=2.24",
    "pandas-gbq>=0.35.2",
]
gcs = ["google-cloud-storage>=3.0"]
full = [
    "polars>=1.0",
    "google-cloud-bigquery>=3.17",
    "google-cloud-bigquery-storage>=2.24",
    "google-cloud-storage>=3.0",
    "pandas-gbq>=0.35.2",
]

[project.scripts]
bassoon = "usagebassoon.cli:app"
usagebassoon = "usagebassoon.cli:app"

[dependency-groups]
dev = [
    "google-cloud-bigquery>=3.17",
    "google-cloud-bigquery-storage>=2.24",
    "google-cloud-storage>=3.0",
    "pandas-gbq>=0.35.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-emoji>=0.2.0",
    "pytest-md>=0.2.0",
    "ruff>=0.8",
    "pyrefly>=0.20",
    "twine>=7.0.0",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>\d+\.\d+\.\d+.*)$'
fallback-version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/usagebassoon"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D", "ANN", "PGH"]
ignore = [
    "D100",    # missing docstring in public module (SQL-only modules)
    "D104",    # missing docstring in public package (__init__.py)
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D212",    # multi-line-summary-first-line (conflicts with D213)
]

[tool.ruff.lint.per-file-ignores]
"src/usagebassoon/parsers/**/*.py" = ["ANN401"]
"src/usagebassoon/merge.py" = ["ANN401"]
"tests/conftest.py" = ["ANN401"]
"tests/test_parsers.py" = ["ANN401"]
"tests/**/*.py" = ["D", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
preset = "strict"
python-version = "3.12"
project-includes = ["src", "tests"]
search-path = ["."]
min-severity = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "bigquery_live: runs against the dedicated usagebassoon_it BigQuery dataset.",
    "gcs_live: runs against the dedicated UsageBassoon GCS test bucket.",
]

[tool.coverage.run]
source = ["src/usagebassoon"]
