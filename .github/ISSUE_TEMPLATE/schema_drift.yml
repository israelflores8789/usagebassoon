name: "🧭 Schema drift or tokscale compatibility problem"
description: "Report a tokscale payload or contract-validation change"
title: "[Schema drift]: "
labels: ["bug"]
body:
- type: markdown
  attributes:
    value: |
      Use this form when `bassoon collect` reports schema drift, rejects a required field, or no longer accepts a tokscale payload. Run `bassoon doctor` and share only its default sanitized output. Do not attach raw payloads, exports, paths, session IDs, or credentials.
- type: input
  id: usagebassoon-version
  attributes:
    label: UsageBassoon version
    description: "For example, the output of `bassoon --version`."
  validations:
    required: true
- type: input
  id: tokscale-version
  attributes:
    label: tokscale version
    description: "Use the exact version, including any prerelease suffix."
    placeholder: "For example, 4.17.0"
  validations:
    required: true
- type: dropdown
  id: payload-kind
  attributes:
    label: Affected payload
    options:
    - graph
    - date-filtered models
    - report
    - pricing
    - More than one or unknown
  validations:
    required: true
- type: textarea
  id: drift-message
  attributes:
    label: Drift warning or validation error
    description: "Paste the complete structural warning or error after removing identifying values."
    render: text
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
    description: "Describe whether collection should continue with a drift warning or reject an incompatible payload."
  validations:
    required: true
- type: textarea
  id: doctor
  attributes:
    label: Sanitized `bassoon doctor` output
    description: "Paste the default output only. Never use `bassoon doctor --raw` in a public issue."
    render: text
  validations:
    required: true
- type: textarea
  id: structure
  attributes:
    label: Sanitized structural details
    description: "Optional: list field names and JSON types from the drifted tokscale payload. Do not include any personal information. Always obfuscate session IDs, workspace paths, project names, etc. if you include raw tokscale JSON output."
    render: text
- type: checkboxes
  id: privacy
  attributes:
    label: Privacy check
    options:
    - label: "I removed credentials, personally-identifiable token-usage data, snapshots, paths, and session identifiers."
      required: true
