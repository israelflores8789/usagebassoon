name: "🐛 Bug report"
description: "Report unexpected UsageBassoon behavior or a runtime error"
title: "[Bug]: "
labels: ["bug"]
body:
- type: markdown
  attributes:
    value: |
      Thanks for reporting a problem. First run `bassoon doctor` and include its default sanitized output below. Do not attach `--raw` output, configuration files, snapshots, query results, tokens, or credentials.
- type: dropdown
  id: area
  attributes:
    label: Affected area
    options:
    - Collection or tokscale integration
    - Configuration or CLI
    - DuckDB or MotherDuck backend
    - BigQuery backend
    - Snapshot or GCS archive
    - Reports, export, or Python API
    - Other
  validations:
    required: true
- type: input
  id: usagebassoon-version
  attributes:
    label: UsageBassoon version
    description: "For example, the output of `bassoon --version`."
  validations:
    required: true
- type: input
  id: tokscale-version
  attributes:
    label: tokscale version
    description: "Required for collection or schema-related problems; otherwise write N/A."
    placeholder: "For example, 4.15.1"
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Minimal reproduction
    description: "List the smallest safe sequence of commands and inputs that reproduces the problem. Redact paths, identifiers, and secrets."
    render: bash
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual behavior or error
    render: text
  validations:
    required: true
- type: textarea
  id: doctor
  attributes:
    label: Sanitized `bassoon doctor` output
    description: "Paste the default output only. Never use `bassoon doctor --raw` in a public issue."
    render: text
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Environment
    description: "OS, Python version, configured backend, and installation method."
  validations:
    required: true
- type: checkboxes
  id: privacy
  attributes:
    label: Privacy check
    options:
    - label: "I removed credentials, personally-identifiable token-usage data, snapshots, local paths, and other sensitive information."
      required: true
